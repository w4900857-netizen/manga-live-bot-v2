<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manga Reader WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .manga-card {
            background-color: #2d2d2d;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .manga-card:active {
            transform: scale(0.98);
        }
        .loader {
            border: 4px solid #333;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden { display: none; }
    </style>
</head>
<body class="p-4">
    <!-- Header -->
    <div id="header" class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-blue-500">Manga Live</h1>
        <button id="back-btn" class="hidden bg-gray-700 px-4 py-2 rounded-lg">عودة</button>
    </div>

    <!-- Loading -->
    <div id="loading" class="flex justify-center items-center h-64 hidden">
        <div class="loader"></div>
    </div>

    <!-- Home View -->
    <div id="home-view" class="grid grid-cols-2 gap-4">
        <!-- Mangas will be loaded here -->
    </div>

    <!-- Chapters View -->
    <div id="chapters-view" class="hidden space-y-2">
        <!-- Chapters will be loaded here -->
    </div>

    <!-- Reader View -->
    <div id="reader-view" class="hidden space-y-0">
        <!-- Images will be loaded here -->
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const homeView = document.getElementById('home-view');
        const chaptersView = document.getElementById('chapters-view');
        const readerView = document.getElementById('reader-view');
        const loading = document.getElementById('loading');
        const backBtn = document.getElementById('back-btn');

        let currentView = 'home';

        async function fetchAPI(endpoint, params = {}) {
            loading.classList.remove('hidden');
            const queryString = new URLSearchParams(params).toString();
            try {
                const response = await fetch(`/api/${endpoint}?${queryString}`);
                return await response.json();
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء التحميل');
            } finally {
                loading.classList.add('hidden');
            }
        }

        async function loadHome() {
            currentView = 'home';
            homeView.innerHTML = '';
            homeView.classList.remove('hidden');
            chaptersView.classList.add('hidden');
            readerView.classList.add('hidden');
            backBtn.classList.add('hidden');

            const mangas = await fetchAPI('home');
            mangas.forEach(manga => {
                const card = document.createElement('div');
                card.className = 'manga-card shadow-lg';
                card.innerHTML = `
                    <img src="${manga.thumbnail || 'https://via.placeholder.com/150x200?text=No+Image'}" class="w-full h-48 object-cover">
                    <div class="p-2">
                        <p class="text-sm font-semibold truncate">${manga.title}</p>
                    </div>
                `;
                card.onclick = () => loadChapters(manga.url);
                homeView.appendChild(card);
            });
        }

        async function loadChapters(mangaUrl) {
            currentView = 'chapters';
            homeView.classList.add('hidden');
            chaptersView.classList.remove('hidden');
            chaptersView.innerHTML = '';
            backBtn.classList.remove('hidden');

            const chapters = await fetchAPI('chapters', { url: mangaUrl });
            chapters.forEach(chapter => {
                const btn = document.createElement('div');
                btn.className = 'bg-gray-800 p-4 rounded-lg active:bg-gray-700';
                btn.innerText = chapter.title;
                btn.onclick = () => loadReader(chapter.url);
                chaptersView.appendChild(btn);
            });
        }

        async function loadReader(chapterUrl) {
            currentView = 'reader';
            chaptersView.classList.add('hidden');
            readerView.classList.remove('hidden');
            readerView.innerHTML = '';

            const images = await fetchAPI('images', { url: chapterUrl });
            images.forEach(imgUrl => {
                const img = document.createElement('img');
                img.src = imgUrl;
                img.className = 'w-full mb-0';
                img.loading = 'lazy';
                readerView.appendChild(img);
            });
            window.scrollTo(0, 0);
        }

        backBtn.onclick = () => {
            if (currentView === 'reader') {
                readerView.classList.add('hidden');
                chaptersView.classList.remove('hidden');
                currentView = 'chapters';
            } else if (currentView === 'chapters') {
                loadHome();
            }
        };

        // Initial Load
        loadHome();
    </script>
</body>
</html>
